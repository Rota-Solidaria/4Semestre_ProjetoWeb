spring.application.name=rotasolidaria

#Lê variáveis locais (ex.: credenciais de e-mail) do arquivo .env na raiz do projeto.
#O .env está no .gitignore: NUNCA coloque senhas diretamente neste arquivo.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8082}

#Configuração do banco de dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/database_dev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC                           
spring.datasource.username=admin
spring.datasource.password=admin

#Configuração do JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Expõe o token CSRF (_csrf) do Spring Security para os templates FreeMarker
spring.freemarker.expose-request-attributes=true

#URL pública da aplicação, usada nos links enviados por e-mail
app.base-url=${APP_BASE_URL:http://localhost:${server.port}}

#Configuração de e-mail. Sem variáveis definidas, usa o Mailpit do docker-compose (localhost:1025).
#Para usar o Gmail, preencha o bloco de e-mail no arquivo .env (veja .env.example).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
#Remetente: por padrão, o próprio e-mail autenticado (o Gmail exige isso)
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:nao-responda@rotasolidaria.local}}
#Nome exibido como remetente (padrão: "Rota Solidária", definido no EmailService)
#app.mail.from-name=
app.password-reset.validity-minutes=30
