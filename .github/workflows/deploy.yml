name: Deploy Local com Self-Hosted Runner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Atualizar Código e Reiniciar Aplicação
        run: |
          cd /home/ramos/rota-solidaria/4Semestre_ProjetoWeb
          
          # Traz as últimas alterações do código
          git pull origin main
          
          # Recompila a aplicação Spring e atualiza o container sem derrubar o MySQL
          docker compose up -d --build --no-deps app
          
          # Remove imagens e camadas Docker antigas para liberar espaço
          docker image prune -f
